version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xlnc-inventory-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:xlncpass123@postgres:5432/xlnc_inventory
      - SESSION_SECRET=xlnc-exotic-homes-production-secret-jwt-key-2026
      - JWT_SECRET=xlnc-super-secret-key-32-bytes-long
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: xlnc-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: xlncpass123
      POSTGRES_DB: xlnc_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xlnc_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
